name: Build and publish application
on: [ push ]
jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests with JDK 21 🧪
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build with Java 21 and run tests
        run: ./gradlew clean build test

  publish:
    name: Publish image to Github Container Registry 📦
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build image
        run: |
          ./gradlew --version
          ./gradlew bootBuildImage --imageName=unblu-visitor-sso-sample
      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag unblu-visitor-sso-sample ghcr.io/unblu/unblu-visitor-sso-sample
          docker tag unblu-visitor-sso-sample ghcr.io/unblu/unblu-visitor-sso-sample:${GITHUB_SHA::8}
          docker push ghcr.io/unblu/unblu-visitor-sso-sample
          docker push ghcr.io/unblu/unblu-visitor-sso-sample:${GITHUB_SHA::8}
